[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-amxx-rs"

# The port's crates, pinned to the commit with version 3 of the plugin API (`ts-plugin-api`,
# the-specialistsmod-rs#104). Until that is merged and pushed this points at the local checkout's
# branch `bots/plugin-loader`; after the merge, put the GitHub URL back with the merged rev.
[workspace.dependencies]
goldsrc-sys = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "15ee7b3c6ff8a037b8772fc0459b0c22042c4ac5" }
ts-plugin-api = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "15ee7b3c6ff8a037b8772fc0459b0c22042c4ac5" }
# Tests only: the port's message encoders, so the parsers are checked against the real wire code.
shared = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "15ee7b3c6ff8a037b8772fc0459b0c22042c4ac5" }

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
