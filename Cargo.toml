[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-amxx-rs"

# The port's crates, pinned to its v3.0.8 release: version 7 of the plugin API (`ts-plugin-api`:
# plugin identities for metamod plugins, `attach_plugin`, so a Pawn plugin can be a bot backend;
# listeners they own; the kung-fu and superjump snapshot flags and the frame's team scores) and its
# server implementation.
[workspace.dependencies]
goldsrc-sys = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", tag = "v3.0.8" }
ts-plugin-api = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", tag = "v3.0.8" }
# Tests only: the port's message encoders, so the parsers are checked against the real wire code.
shared = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", tag = "v3.0.8" }

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true

