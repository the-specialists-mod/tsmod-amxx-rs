[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-amxx-rs"

# The port's crates, pinned to the commit with version 4 of the plugin API (`ts-plugin-api`,
# the-specialistsmod-rs#117 and #99: team scores, objectives, entities from keys, the gun's and the
# query functions' entity hooks) and its server implementation, on the port's main.
[workspace.dependencies]
goldsrc-sys = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "38cd7b8bac90696415d40afe019507b9d28d42c4" }
ts-plugin-api = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "38cd7b8bac90696415d40afe019507b9d28d42c4" }
# Tests only: the port's message encoders, so the parsers are checked against the real wire code.
shared = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "38cd7b8bac90696415d40afe019507b9d28d42c4" }

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
