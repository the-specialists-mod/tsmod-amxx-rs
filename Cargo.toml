[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-amxx-rs"

# The port's crates, pinned to the main commit with version 3 of the plugin API (`ts-plugin-api`,
# the-specialistsmod-rs#104: the tsmod_* loader, bot backends) and its server implementation.
[workspace.dependencies]
goldsrc-sys = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "5a8ec9465ae0c6f79e3b270b75549ce4f2a545ad" }
ts-plugin-api = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "5a8ec9465ae0c6f79e3b270b75549ce4f2a545ad" }
# Tests only: the port's message encoders, so the parsers are checked against the real wire code.
shared = { git = "https://github.com/the-specialists-mod/the-specialistsmod-rs", rev = "5a8ec9465ae0c6f79e3b270b75549ce4f2a545ad" }

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
