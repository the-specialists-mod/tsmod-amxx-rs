[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"
repository = "https://github.com/the-specialists-mod/tsmod-amxx-rs"

# The port's crates, pinned to its local `plugin-api-v6` branch (not pushed yet; repin to the
# release tag that ships it): version 6 of the plugin API (`ts-plugin-api`: the bot backends'
# frame queries, run_cmd's result and the touch, damage, shot and pickup callbacks) and its server
# implementation.
[workspace.dependencies]
goldsrc-sys = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "ed64e5070370d91e02e48574332a1673e2adaee8" }
ts-plugin-api = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "ed64e5070370d91e02e48574332a1673e2adaee8" }
# Tests only: the port's message encoders, so the parsers are checked against the real wire code.
shared = { git = "file:///home/mmckenzie/dev/hl/rust-hlmod-the-specialists", rev = "ed64e5070370d91e02e48574332a1673e2adaee8" }

[profile.dev]
panic = "abort" # unwinding across the C ABI is UB; be explicit

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = true
